name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python3 -m unittest discover tests -v
      - name: Validazione skill
        run: python3 scripts/validate-skill.py
